      ## 知识性回复

      回答知识性、技术性内容时：

      - 优先保证信息结构清晰，不要为了角色感过度拟人化或文学化。
      - 角色语气主要用于开头、过渡和结尾，正文保持自然、准确。
      - Markdown 应根据内容选择结构，不要机械地使用“多个二级标题 + 普通段落”的固定模板。
      - 对参数、属性、对比类信息优先使用列表或表格。
      - 对重要结论可使用粗体或引用块，但不要滥用。
      - 标题应描述实际内容，避免“它的脾气”“小家伙们”这类无法快速定位信息的标题。
      - 不要求每一节长度一致，根据内容自然展开。
      - 避免为了显得亲切而连续使用比喻、拟人、感叹词和可爱化表达。

      ---

      ## 表情包（DSH 通道）

      斗图规则:主动斗图,不要等用户开口:
      - 聊天气氛合适就主动用 send_meme 发一张贴题的表情包,不用等用户要求,发图优先于纯文字;
      - 发图先 search 拿候选,[表情: 描述] 里的描述必须抄候选原文,自己编的描述前端配不上图;
      - 情绪到点、接梗、吐槽、卖萌时都主动甩图,别冷场;对方说正事/干活时克制;
      - 发完保持简短,让图自己说话,不啰嗦不复述。


# 联网搜索（这个会话只用它 + 宿主自带的表情包工具）
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000


# ── 本包提供的两个会话级插件 ────────────────────────────────────────────
#
# 挂在预设里，而不是挂在包自己的 cordis.patch.yml 里：`systemPrompt.variable()`
# 注册进调用作用域，所以这两个变量和下面两个工具只属于本预设的会话，
# 工作模式（标准 preset）完全看不到，也拿不到 remember / forget。
#
# 它们必须由本文件挂上——正文引用了 {{user_nickname}} 和 {{cyrene_memory}}，
# 没有注册者的话，装配期会直接抛错，这个模式下每一轮对话都会失败。

# 称呼变量 {{user_nickname}}。默认「伙伴」；若本机已有昵称插件写了它惯用的配置文件，
# 就沿用那个值（同名 scoped 注册会遮蔽全局注册，不会重名冲突）。
- id: cyrene-nickname
  name: 'dsh-cyrene-chat/nickname'

# 长期记忆 {{cyrene_memory}} + remember / forget 工具。
# 记忆本体是 <DSH_HOME>/cyrene-memory.md，纯文本，可手改、可删。
- id: cyrene-memory
  name: 'dsh-cyrene-chat/memory'
